name: build

on:
  pull_request:
  push:
    branches: [main, "26.3"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      # The pinned runtime comes from public Packman; no credentials are used.
      - name: Build and test
        run: '& "$env:GITHUB_WORKSPACE\gradlew.bat" build test'
      # The lightweight JAR: it needs the runtime a development setup or the installer stages.
      - name: Upload mod JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rtx-remix-renderer-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
