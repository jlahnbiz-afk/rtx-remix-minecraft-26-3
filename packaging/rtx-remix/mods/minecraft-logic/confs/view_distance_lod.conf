# Far view-distance endpoint for LOD terrain (Distant Horizons). It sits just
# above confs/view_distance.conf, and the mod blends it from strength 0 at
# Minecraft's own render distance toward 1 at Distant Horizons' largest LOD
# radius (4096 chunks), keeping the same 70%..80% fade band at the LOD radius.
# Without LOD terrain the strength stays 0.
#
# Like view_distance.conf this integration-owned profile is not an art
# profile. Keep it sparse so situational profiles can override these keys.
rtx.viewDistance.distanceFadeMin = 45875.2
rtx.viewDistance.distanceFadeMax = 52428.8
